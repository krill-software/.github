name: Krill app release (reusable)

# Reusable build + publish pipeline for krill-software apps.
#
# Tagged with `v*` in any consumer repo, the consumer's local workflow calls
# this one and passes a couple of display strings; everything else (Linux
# system deps, Rust toolchain, pnpm setup, tauri-action, draft release body)
# is fixed here so all krill apps stay in sync.
#
# Usage from a consumer app:
#
#   # .github/workflows/release.yml in the app repo
#   name: Release
#   on:
#     push:
#       tags: ['v*']
#     workflow_dispatch:
#   jobs:
#     release:
#       uses: krill-software/.github/.github/workflows/krill-app-release.yml@main
#       with:
#         product-name: "Document Viewer"
#         example-file: "paper.pdf"
#       permissions:
#         contents: write

on:
  workflow_call:
    inputs:
      product-name:
        required: true
        type: string
        description: "Display name shown in the release title and filenames (e.g. 'Document Viewer')."
      example-file:
        required: true
        type: string
        description: "Example file path used in install instructions (e.g. 'paper.pdf')."

jobs:
  release:
    name: Build & publish (linux-x64)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build & upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ inputs.product-name }} ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Install

            **Debian / Ubuntu** — registers the app as a candidate "Open with…" handler:

            ```sh
            sudo dpkg -i "${{ inputs.product-name }}"_*_amd64.deb
            ```

            **AppImage** — portable, any Linux x86_64:

            ```sh
            chmod +x "${{ inputs.product-name }}"_*.AppImage
            ./"${{ inputs.product-name }}"_*.AppImage path/to/${{ inputs.example-file }}
            ```

            Verify with `sha256sum -c SHA256SUMS`.

            ---

            *Built by the shared [krill-app-release](https://github.com/krill-software/.github/blob/main/.github/workflows/krill-app-release.yml) workflow.*
